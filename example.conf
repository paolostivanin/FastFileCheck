# Example configuration file for FastFileCheck
[settings]
# Number of threads to use for hashing.
# Set to 0 to automatically use all available cores minus one (default).
threads_count = 0

# Percentage of total system RAM to use for file processing (default is 70%).
# This value should be between 10 and 90.
ram_usage_percent = 70

# Limit the number of worker threads independently from the CPU count (it can only lower it).
# 0 (default) = use threads_count. Not needed for HDDs when the HDD mode below is active: reads are
# issued in disk order by a single scheduler and the workers only hash data that is already cached.
io_threads = 0

# Storage type of the scanned directories: auto (default), hdd or ssd.
# auto = HDD mode if the kernel reports any scanned directory as being on a rotational device
#        (/sys/class/block/<dev>/queue/rotational); network/FUSE/tmpfs count as non-rotational.
# HDD mode: directories are walked in inode order, files that must be read are put in on-disk
# order (FIEMAP; inode order where unsupported), read with large requests and prefetched ahead
# of the hashing, so the disk head sweeps instead of jumping between ~30 concurrent streams.
storage = auto

# HDD mode: how much data (in MB) may be requested from the disk ahead of the hashing.
# 0 (default) = automatic (1/8 of the usable RAM, between 64 MB and 1 GB).
prefetch_mb = 0

# Run with idle I/O priority so that other programs always win the disk (default false).
# Only effective with the BFQ I/O scheduler (mq-deadline and none ignore it).
low_priority = false


[database]
# Database directory path (default is '/var/lib/ffc/'). Note that the name is fixed and cannot be changed.
db_path = /var/lib/ffc/

# Maximum size of the LMDB database (in MB, default is 15 MB). Must be at least 5.
# Ensure this size is sufficient: an entry takes roughly 150 bytes plus the path, so 15 MB holds
# about 100,000 files. When the database is full the run stops with an error (exit code 2).
db_size_mb = 15

# Number of DB writes per transaction batch (default 500).
# Higher values = fewer fsyncs = faster on HDD, but more data at risk on crash.
db_batch_size = 500

# HDD performance tuning (advanced; trades durability for speed). All default to false (safe).
# Enabling these can significantly speed up operations on HDDs.
# See LMDB docs for details.
# - lmdb_nosync: Reduce fsync frequency. A system crash or power loss can corrupt the whole database.
lmdb_nosync = false
# - lmdb_nometasync: Skip metadata fsyncs. The last commit may be lost on a system crash or power loss.
lmdb_nometasync = false
# - lmdb_mapasync: Let OS flush dirty pages asynchronously. Unsafe on a system crash.
lmdb_mapasync = false
# - lmdb_writemap: Use a writeable memory map; faster writes, but a stray write can corrupt the database.
lmdb_writemap = false


[logging]
# Enable or disable writing information to the log file. Default enabled.
log_to_file_enabled = true
# Log file directory path (default is '/var/log/'). Name will be set to 'ffc.log' and cannot be changed.
log_path = /var/log/ffc/


[scanning]
# Specifies the maximum depth of directory traversal during scanning (default 10)
# Valid values range from 0 (no recursion, only the starting directory is scanned) to 64 (allows traversal up to 64 levels deep).
max_recursion_depth = 10

# Directories to scan for files (default is '/home' and '/root').
# You can add more directories by separating them with commas. Symbolic links found inside them
# are not followed (a symbolic link given here as a directory is).
directories = /home

# Exclude hidden files and directories (those starting with '.'). Default enabled.
exclude_hidden = true

# Exclude directories from scanning (default is empty).
# You can add more directories (full path) by separating them with commas.
exclude_directories =

# Exclude file extensions from scanning.
# You can add more extensions by separating them with commas.
exclude_extensions = .tmp,.swp,.bak,.cache,.log,~,.part

# Enable quick check mode: skip reading a file when its size, mtime and ctime (nanosecond resolution)
# are unchanged. Dramatically speeds up re-checks when most files haven't changed. Inode, link count and
# block count are still compared. ctime cannot be forged from user space, so tools that restore an old
# mtime (rsync -t, cp -p, touch -d) do not fool it.
# Use --full flag to override and force a full re-hash.
quick_check = true

# Rolling scrub: quick_check cannot see silent corruption (bit rot changes no metadata), so every run also
# re-hashes the slice of the files that became due since the last run: each file is read completely at
# least once every scrub_days days, however often or rarely you run, and a run only reads that slice
# (about 1/scrub_days of the data for a daily run). In 'update' mode a file whose content changed while its
# metadata did not is reported as corruption and its database entry is left untouched.
# 0 disables it (corruption is then only found with --full). Default 30.
scrub_days = 30
